services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - /opt/stacks/mqtt/data:/mosquitto/data
      - /opt/stacks/mqtt/log:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_PASSWORD_FILE:-/opt/stacks/mqtt/config/passwd}:/mosquitto/config/passwd:ro

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      INFLUXDB_DB: ${INFLUXDB_ENERGY_DB:-tuya}
    volumes:
      - influxdb_data:/var/lib/influxdb

  telegraf:
    image: telegraf:1.36
    container_name: smart-env-telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
      - mosquitto
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ENV_DB: ${INFLUXDB_ENV_DB:-smart_environment}
      INFLUX_ENERGY_DB: ${INFLUXDB_ENERGY_DB:-tuya}
      MQTT_SERVER: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-esp32}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
      MQTT_ENV_TOPIC: ${MQTT_ENV_TOPIC:-smart-environment-sensor/#}
      MQTT_ENERGY_TOPIC: ${MQTT_ENERGY_TOPIC:-smart-energy/tuya/energia}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      INFLUXDB_ENERGY_DB: ${INFLUXDB_ENERGY_DB:-tuya}
      INFLUXDB_ENV_DB: ${INFLUXDB_ENV_DB:-smart_environment}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  influxdb_data:
    external: true
    name: tucho235_influxdb_data
  grafana_data:
    external: true
    name: tucho235_grafana_data
